<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6ecfa">
  <title>Nkemji's LifeBox</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LifeBox">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Nkemji's LifeBox 📦</h1>
      <p class="tag">Check the box first.</p>
    </header>

    <input id="q" type="search" placeholder="Search everything in the box" aria-label="Search everything">

    <div class="tools">
      <button id="surprise" class="tool">🎲 Surprise me</button>
      <button id="gamesnight" class="tool">🎮 Games night</button>
      <button id="export" class="tool">⬇️ Export</button>
    </div>

    <nav id="groups" class="chips" aria-label="Groups"></nav>
    <nav id="cats" class="chips small" aria-label="Categories" hidden></nav>

    <p id="count" class="count"></p>
    <section id="grid" class="grid"></section>
  </main>

  <button id="add" class="fab" aria-label="Add to the box">+</button>

  <dialog id="dlg">
    <form id="form">
      <h2 id="dlg-title">Add to the box</h2>
      <label>Title <input id="f-title" placeholder="What did you find? Or just paste a link below"></label>
      <label>Category <select id="f-cat"></select></label>
      <label>Link <input id="f-link" type="url" inputmode="url" placeholder="Paste a link"></label>
      <details id="more">
        <summary>Add details</summary>
        <label>Notes <textarea id="f-notes" rows="3" placeholder="Why you saved it"></textarea></label>
        <label>Tags <input id="f-tags" placeholder="games night, cozy"></label>
        <label>Status <select id="f-status"></select></label>
        <div id="extra"></div>
        <label>Image link <input id="f-image" type="url" inputmode="url" placeholder="Image uploads come later"></label>
      </details>
      <div class="actions">
        <button type="button" id="delete" class="ghost danger">Delete</button>
        <button type="button" id="cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="login">
    <form id="login-form">
      <h2>Open the box 📦</h2>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="count" hidden>That password did not work. Try again.</p>
      <div class="actions"><button type="submit" class="primary">Open</button></div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
